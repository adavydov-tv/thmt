{{- $env := .Values.dashboard.ops.environment }}
{{- $sec := .Values.dashboard.secrets }}

{{- if and $sec.insecureInConfigMap (or (eq $env "production") (eq $env "stable")) }}
{{- fail "secrets.insecureInConfigMap puts credentials in a ConfigMap and is only allowed in local/staging. Use secrets.existingSecret with an ExternalSecret from the org secret store." }}
{{- end }}
{{- if and $sec.data (eq $env "production") }}
{{- fail "secrets.data must not be used in production: point secrets.existingSecret at the Secret projected by an ExternalSecret from the org secret store." }}
{{- end }}
{{- if eq $env "production" }}
{{- if and $sec.create (not $sec.existingSecret) }}
{{- fail "secrets.create renders a chart-managed Secret from Helm values and is not permitted in production. Set secrets.create=false and point secrets.existingSecret at the Secret an ExternalSecret projects from the org secret store." }}
{{- end }}
{{- if not $sec.existingSecret }}
{{- fail "production requires secrets.existingSecret: the service has no credentials otherwise." }}
{{- end }}
{{- end }}

{{- if and $sec.create (not $sec.existingSecret) }}
# Chart-managed Secret — только staging и local. В production сюда ничего не
# рендерится: secrets.existingSecret называет Secret, который ExternalSecret
# проецирует из хранилища секретов, и токены не проходят через Helm values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dashboard.name" . }}-secrets
  labels: {{- include "dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.dashboard.postgres.enabled }}
  # Дефолт существует только чтобы голый `helm install` завёлся со встроенной
  # базой; везде, где это важно, — переопределить.
  POSTGRES_PASSWORD: {{ (get $sec.data "POSTGRES_PASSWORD") | default $sec.insecurePostgresPassword | quote }}
  {{- end }}
  {{- range $k, $v := $sec.data }}
  {{- if ne $k "POSTGRES_PASSWORD" }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
