{{- if .Values.dashboard.postgres.enabled }}
{{- if eq .Values.dashboard.ops.environment "production" }}
{{- fail "the bundled Postgres is not permitted in production: single writer, no replication, no backups. Set postgres.enabled=false and put POSTGRES_DSN into the Secret." }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dashboard.name" . }}-pgdata
  labels: {{- include "dashboard.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.dashboard.postgres.storage.className }}
  resources:
    requests:
      storage: {{ .Values.dashboard.postgres.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dashboard.name" . }}-db
  labels: {{- include "dashboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate            # единственный writer на RWO-томе
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dashboard.name" . }}-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dashboard.name" . }}-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.dashboard.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.dashboard.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              {{- with (include "dashboard.secretName" .) }}
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: POSTGRES_PASSWORD
              {{- else }}
              value: {{ .Values.dashboard.secrets.insecurePostgresPassword | quote }}
              {{- end }}
            - name: POSTGRES_DB
              value: {{ .Values.dashboard.postgres.db | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.dashboard.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: {{ include "dashboard.name" . }}-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dashboard.name" . }}-db
  labels: {{- include "dashboard.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "dashboard.name" . }}-db
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
